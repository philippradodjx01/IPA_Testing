name: Build iPhone IPA

on:
  push:
    branches: [main]
    paths: ['.github/workflows/dart.yml', 'ios/**', 'lib/**', 'assets/**', 'pubspec.*']
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Laravel API URL reachable from your iPhone (include /api/v1)'
        required: true
        default: 'http://192.168.0.61:8000/api/v1'
        type: string

permissions:
  contents: read

concurrency:
  group: iphone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build unsigned IPA for personal signing
    runs-on: macos-15
    timeout-minutes: 30
    env:
      API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL || 'http://192.168.0.61:8000/api/v1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build iPhone app
        run: flutter build ios --release --no-codesign --dart-define="API_BASE_URL=$API_BASE_URL"
      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          ditto build/ios/iphoneos/Runner.app build/ipa/Payload/Runner.app
          cd build/ipa
          zip -qry RaiApp-unsigned.ipa Payload
          unzip -t RaiApp-unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RaiApp-unsigned-iphone
          path: build/ipa/RaiApp-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Installation note
        run: |
          echo '### iPhone build' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download RaiApp-unsigned-iphone from Artifacts and extract the ZIP. Sign the IPA before installation using AltStore Classic with AltServer on Windows. This is not an App Store or TestFlight build.' >> "$GITHUB_STEP_SUMMARY"
